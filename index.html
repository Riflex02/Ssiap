<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel SSIAP 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Idée : la façade d'un tableau SSI. Un bandeau sombre porte les voyants de zone et le compte à rebours ; le reste est clair, net, lettré comme une signalétique. */
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --surface2:#F3F6F0; --ink:#16201B; --muted:#58645D; --line:#D5DBD2;
  --evac:#0A7A4A; --on-evac:#FFFFFF; --evac-soft:#DCEFE5; --fire:#C4221B; --fire-soft:#F9E1DF; --amber:#B57C00; --amber-soft:#F6EBCF; --off:#AEB6AC;
  --s1:#2a78d6; --s2:#eb6834; --s1-soft:#DDEAFA; --s2-soft:#FCE4DA;
  --hero:#13221B; --hero2:#1E382C; --hero-ink:#EEF4EF; --hero-muted:#A6B8AD; --hero-line:#33493E;
  --shadow:0 1px 2px rgba(20,35,28,.06),0 6px 18px rgba(20,35,28,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412; --surface:#18201D; --surface2:#1F2925; --ink:#E7ECE7; --muted:#96A29A; --line:#2C3731;
    --evac:#2FBF7F; --on-evac:#07150E; --evac-soft:#16382A; --fire:#FF6257; --fire-soft:#3A1C1A; --amber:#F2B93B; --amber-soft:#3A2F12; --off:#46524B;
    --s1:#3987e5; --s2:#d95926; --s1-soft:#172C47; --s2-soft:#40200F;
    --hero:#1A2621; --hero2:#24382E; --hero-ink:#EEF4EF; --hero-muted:#A6B8AD; --hero-line:#3A4F44;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#18201D; --surface2:#1F2925; --ink:#E7ECE7; --muted:#96A29A; --line:#2C3731;
  --evac:#2FBF7F; --on-evac:#07150E; --evac-soft:#16382A; --fire:#FF6257; --fire-soft:#3A1C1A; --amber:#F2B93B; --amber-soft:#3A2F12; --off:#46524B;
  --s1:#3987e5; --s2:#d95926; --s1-soft:#172C47; --s2-soft:#40200F;
  --hero:#1A2621; --hero2:#24382E; --hero-ink:#EEF4EF; --hero-muted:#A6B8AD; --hero-line:#3A4F44;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.brand b{color:var(--fire)}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-size:14px}
.sec{display:flex;align-items:center;gap:10px;margin-top:6px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--off);flex:none;border:1px solid rgba(0,0,0,.25)}
.led.g{background:var(--evac);box-shadow:0 0 7px var(--evac)}
.led.a{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.led.r{background:var(--fire);box-shadow:0 0 7px var(--fire)}
/* bandeau */
.hero{background:linear-gradient(160deg,var(--hero),var(--hero2));color:var(--hero-ink);border-radius:20px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--hero-line)}
.hero .link{color:var(--hero-muted)}
.hero .brand b{color:#FF6B5F}
.count{display:flex;align-items:flex-end;gap:14px}
.count .big{font-family:var(--display);font-weight:700;font-size:76px;line-height:.82;letter-spacing:-.01em;white-space:nowrap;flex:none}
.hero .muted{color:var(--hero-muted)}
.zones{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;border-top:1px solid var(--hero-line);padding-top:12px}
.zones div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--hero-muted);font-weight:600;letter-spacing:.04em}
.hero .led{background:#3C5046;border-color:rgba(0,0,0,.4)}
.hero .led.g{background:#35D08A;box-shadow:0 0 8px #35D08A}
.hero .led.a{background:#F2B93B;box-shadow:0 0 8px #F2B93B}
.hero .led.r{background:#FF6257;box-shadow:0 0 8px #FF6257}
.rankline{display:flex;justify-content:space-between;gap:12px;font-size:14px;align-items:baseline}
.rankline b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.rankline span{text-align:right}
.hero .bar{background:var(--hero-line)}
.hero .bar i{background:#35D08A}
/* duel des scores */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--surface2)}
.player.me{border-color:var(--evac);box-shadow:inset 0 0 0 1px var(--evac)}
.who{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;color:#fff;flex:none}
.player .name{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase}
.player .xp{font-family:var(--display);font-weight:700;font-size:36px;line-height:1}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.rows{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:58px;box-shadow:var(--shadow);transition:transform .08s}
.btn .t,.mode .t{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.1}
.btn .d,.mode .d{font-size:14px;color:var(--muted);line-height:1.3}
.btn.go{background:var(--evac);color:var(--on-evac);border-color:var(--evac)}
.btn.go .d{color:var(--on-evac);opacity:.88}
.btn.fire{border-color:var(--fire)}
.btn:active,.mode:active,.opt:active{transform:scale(.985)}
.arrow{font-family:var(--display);font-size:24px;flex:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;align-items:flex-start;min-height:128px;box-shadow:var(--shadow);transition:transform .08s}
.mode.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.mode.wide>span:last-child{display:flex;flex-direction:column;gap:2px}
.mode.star{background:var(--evac);border-color:var(--evac);color:var(--on-evac)}
.mode.star .d{color:var(--on-evac);opacity:.9}
.mode.star .ico{background:rgba(255,255,255,.2);color:var(--on-evac)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--evac-soft);color:var(--evac);flex:none}
.ico.f{background:var(--fire-soft);color:var(--fire)}
.ico.a{background:var(--amber-soft);color:var(--amber)}
.ico.b{background:var(--s1-soft);color:var(--s1)}
.ico.o{background:var(--s2-soft);color:var(--s2)}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--evac-soft);color:var(--evac)}
.tag.todo{background:var(--amber-soft);color:var(--amber)}
.theme{display:flex;align-items:center;gap:12px}
.theme .pc{margin-left:auto;font-family:var(--display);font-weight:700;font-size:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--evac);border-radius:4px}
.q{font-size:20px;font-weight:600;line-height:1.3;text-wrap:balance}
.opt{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:54px;font-weight:500;display:flex;align-items:center;gap:12px;transition:transform .08s}
.ltr{width:28px;height:28px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none;color:var(--muted)}
.opt.ok{background:var(--evac);border-color:var(--evac);color:var(--on-evac)}
.opt.ok .ltr,.opt.ko .ltr{background:transparent;border-color:currentColor;color:inherit}
.opt.ko{border-color:var(--fire);color:var(--fire);background:var(--fire-soft)}
.opt[disabled]{cursor:default}
.note{border-left:4px solid var(--amber);padding:10px 12px;background:var(--amber-soft);border-radius:0 10px 10px 0;font-size:15px}
.keep{border-left:4px solid var(--evac);padding:10px 12px;background:var(--evac-soft);border-radius:0 10px 10px 0;font-size:15px}
.keep b{display:block;font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.lesson p+p{margin-top:8px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.score{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:112px;height:112px;flex:none}
.ring text{font-family:var(--display);font-weight:700;font-size:30px;fill:var(--ink)}
.hearts{font-size:20px;letter-spacing:2px;color:var(--fire)}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
input.code{width:100%;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;box-shadow:var(--shadow)}
.pick .name{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.tile b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.tile span{font-size:13px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .nm{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;font-size:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
#tip{font-size:14px;min-height:20px}
details summary{cursor:pointer;font-size:14px;color:var(--muted);padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
td.win{font-weight:700}
td.win::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--evac);margin-left:6px;vertical-align:middle}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0}
.row:last-child{border-bottom:0}
.up{color:var(--evac);font-weight:600}.down{color:var(--fire);font-weight:600}
.card{border:2px solid var(--line);border-radius:18px;background:var(--surface);padding:26px 16px;min-height:200px;display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.card .front{font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;line-height:1.1}
.card .back{font-size:20px;font-weight:600;color:var(--evac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* duel face à face */
.duel{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.half{flex:1;min-height:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.half.flip{transform:rotate(180deg)}
.half .q{font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .opt{min-height:54px;padding:8px 10px;font-size:14px;line-height:1.2;border-radius:10px}
.half.lock .opt{opacity:.45}
.mid{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:var(--hero);color:var(--hero-ink);font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
.mid button{background:none;border:1px solid currentColor;border-radius:6px;color:inherit;font-family:var(--body);font-size:13px;padding:4px 8px;text-transform:none}
@media (prefers-reduced-motion: no-preference){
  .led.r{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.35}}
  #app.in>*{animation:rise .26s ease both}
  @keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
  .opt.ok{animation:pop .28s ease}
  @keyframes pop{50%{transform:scale(1.03)}}
  .opt.ko{animation:shake .3s ease}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var P={r:{n:"Romain",full:"Romain Degeldere",role:"Recyclage SSIAP 2"},l:{n:"Logan",full:"Logan Aernout",role:"Remise à niveau, examen le 30"}};
var T=[
 {n:"Le feu",f:["Triangle du feu : combustible + comburant (oxygène de l'air, environ 21 %) + énergie d'activation.","Classes de feux : A solides, B liquides et solides liquéfiables, C gaz, D métaux, F huiles et graisses de cuisson.","Propagation : conduction (à travers la matière), convection (air chaud et fumées), rayonnement, projection.","Extinction : refroidissement (eau), étouffement (CO2, mousse), isolement du combustible, inhibition (poudre).","Fumées : chaudes, opaques, mobiles, inflammables, toxiques. Elles tuent avant les flammes.","Flash-over : embrasement généralisé éclair du volume. Backdraft : explosion de fumées par apport d'air brutal."]},
 {n:"Classement ERP et IGH",f:["Catégories : 1re au-dessus de 1 500 ; 2e de 701 à 1 500 ; 3e de 301 à 700 ; 4e 300 et moins ; 5e sous le seuil du type.","1er groupe : catégories 1 à 4 (public + personnel). 2e groupe : 5e catégorie (public seul).","Types : J personnes âgées et handicapées, L spectacles et conférences, M magasins, N restaurants, O hôtels, P danse et jeux, R enseignement, S bibliothèques, T expositions, U soins, V culte, W bureaux et banques, X sport couvert, Y musées.","Types spéciaux : PA plein air, CTS chapiteaux, SG structures gonflables, PS parkings couverts, OA hôtels d'altitude, GA gares, EF flottants, REF refuges.","IGH : plancher bas du dernier niveau à plus de 50 m (habitation) ou plus de 28 m (autres).","Classes IGH : GHA habitation, GHO hôtel, GHR enseignement, GHS archives, GHU sanitaire, GHW bureaux, GHZ mixte. Compartiment : 2 500 m² maximum."]},
 {n:"Évacuation et construction",f:["Unité de passage : 0,60 m. Exceptions : 1 UP = 0,90 m et 2 UP = 1,40 m. Ensuite 3 UP = 1,80 m.","De 101 à 500 personnes : 2 dégagements, et autant d'UP que de centaines (arrondi au-dessus) + 1.","Réaction au feu : M0 incombustible à M4 facilement inflammable. Résistance : stable au feu (R), pare-flammes (E), coupe-feu (EI).","Désenfumage : extraire fumées et chaleur pour garder les cheminements praticables, limiter la propagation, aider les secours. Naturel ou mécanique, par balayage.","Éclairage de sécurité : évacuation (balisage) et ambiance (5 lumens par m²). Autonomie 1 heure.","Voie engins : 3 m de large, 3,50 m de hauteur libre. Voie échelle : 4 m de large, 10 m de long minimum.","EAS : espace d'attente sécurisé pour les personnes qui ne peuvent pas évacuer seules."]},
 {n:"SSI et alarme",f:["5 catégories de SSI : A, B, C, D, E. Le SSI A = SDI (détection) + SMSI (mise en sécurité).","SSI A : équipement d'alarme type 1. SSI B : type 2a.","SDI : détecteurs, déclencheurs manuels, ECS. SMSI : CMSI, DAS, UGA, diffuseurs sonores.","Fonctions de mise en sécurité : compartimentage, désenfumage, évacuation, arrêt de certaines installations techniques.","Zones : ZD détection, ZA alarme, ZC compartimentage, ZF désenfumage, ZS mise en sécurité.","Alarme restreinte : temporisation de 5 minutes maximum. Alarme générale : 5 minutes minimum.","Déclencheurs manuels : à chaque niveau, près des escaliers et des sorties, à 1,30 m environ."]},
 {n:"Moyens de secours",f:["Extincteurs (code du travail) : 6 litres d'eau pulvérisée minimum pour 200 m², au moins un par niveau. Vérification annuelle.","Eau pulvérisée avec additif : A et B. CO2 : B et feux d'origine électrique. Poudre ABC : polyvalente. Jamais d'eau sur une friteuse en feu.","RIA : DN 19/6, 25/8, 33/12. Pression minimale de 2,5 bars au RIA le plus défavorisé.","Colonne sèche : vide, alimentée par les sapeurs-pompiers. Colonne en charge (humide) : IGH de plus de 50 m.","Poteau d'incendie DN 100 : 60 m3/h sous 1 bar.","Sprinkleur : détecte, alerte et attaque le feu. Ampoule rouge : 68 °C."]},
 {n:"Réglementation",f:["ERP : règlement de sécurité du 25 juin 1980 modifié. IGH : arrêté du 30 décembre 2011. SSIAP : arrêté du 2 mai 2005 modifié.","Livres d'articles : GN généralités, CO construction, AM aménagements, DF désenfumage, CH chauffage, GZ gaz, EL électricité, EC éclairage, AS ascenseurs, GC grandes cuisines, MS moyens de secours.","La commission de sécurité donne un avis, favorable ou défavorable. Le maire décide et autorise l'ouverture par arrêté.","CCDSA : présidée par le préfet. Commission d'arrondissement : sous-préfet. Commission communale : maire.","Registre de sécurité : personnel du service incendie, consignes, dates et observations des contrôles et vérifications, travaux.","Recyclage tous les 3 ans (SSIAP 2 : 14 h). Remise à niveau (SSIAP 2 : 21 h) si la date est dépassée ou sans 1 607 h d'activité sur 36 mois.","Service de sécurité (MS 46) : 3 personnes minimum présentes en même temps, dont un chef d'équipe."]},
 {n:"Chef d'équipe",f:["Missions SSIAP 2 : manager l'équipe, former le personnel à la sécurité incendie, prévision technique, entretien élémentaire des moyens, assistance aux personnes, diriger le poste de sécurité lors d'un sinistre, faire respecter l'hygiène et la sécurité du travail côté incendie.","Une consigne : claire, précise, et on vérifie qu'elle est comprise (reformulation). Déléguer une tâche ne retire pas le contrôle du résultat.","En urgence : management directif. Hors urgence : adapter le style à l'agent et à la situation.","Compte rendu : Qui, Quoi, Où, Quand, Comment, Pourquoi. Main courante : tout, dans l'ordre chronologique.","Permis de feu : pour tout travail par point chaud, établi avant les travaux par le chef d'établissement ou son représentant. Surveillance au moins 2 heures après.","Code du travail : exercices d'évacuation au moins tous les 6 mois. Accident du travail déclaré par l'employeur sous 48 h. Droit de retrait en cas de danger grave et imminent."]},
 {n:"Poste de sécurité",f:["Alarme feu : prendre en compte, lire la zone, envoyer un agent en levée de doute avec radio et extincteur.","Feu confirmé : alarme générale sans attendre la fin de la temporisation, puis alerte des secours.","Message d'alerte : adresse précise, nature du sinistre, victimes, risques particuliers, mesures prises. On ne raccroche que quand l'opérateur le dit.","Numéros : 18 pompiers, 15 SAMU, 17 police, 112 numéro européen, 114 par SMS pour sourds et malentendants.","Accueil des secours : un agent au point d'accès avec plans, clés et radio. Le service se met à disposition du commandant des opérations de secours (COS).","Après : réarmement du SSI une fois le sinistre terminé, main courante, compte rendu, remise en état des moyens."]}
];
/* [thème, question, [bonne réponse, 3 fausses], explication] */
var Q=[

 {h:"La combustion",p:["Un feu est une réaction chimique qui dégage de la chaleur. Elle a besoin de trois choses en même temps : un combustible (ce qui brûle), un comburant (en général l'oxygène de l'air, environ 21 %) et une énergie d'activation (flamme, étincelle, surface chaude, frottement). C'est le triangle du feu.","Si on retire un seul côté du triangle, le feu s'arrête. Toutes les méthodes d'extinction partent de là.","Selon sa vitesse, une combustion est lente (un feu couvant), vive (un feu avec flammes) ou très vive (une explosion)."],k:"Combustible + comburant + énergie d'activation. On en retire un, le feu s'éteint."},
 {h:"Ce qui brûle",p:["Les feux sont rangés en classes selon le combustible : A pour les solides qui font des braises (bois, papier, carton, tissu), B pour les liquides et les solides qui fondent (essence, alcool, plastiques), C pour les gaz, D pour les métaux, F pour les huiles et graisses de cuisson.","Un solide ne brûle pas directement : la chaleur le décompose et ce sont les gaz dégagés qui s'enflamment. C'est la pyrolyse. Un liquide brûle par ses vapeurs : au point d'éclair, il en émet assez pour s'enflammer au contact d'une flamme. À la température d'auto-inflammation, il s'enflamme tout seul.","Un gaz ne s'enflamme que si son mélange avec l'air se situe entre la limite inférieure et la limite supérieure d'explosivité (LIE et LSE)."],k:"A solides, B liquides, C gaz, D métaux, F huiles de cuisson. Point d'éclair : avec flamme. Auto-inflammation : sans flamme."},
 {h:"Comment le feu se propage",p:["Par conduction : la chaleur traverse la matière, par exemple une cloison métallique ou une canalisation. Par convection : l'air chaud et les fumées montent et transportent la chaleur dans les étages et les gaines. Par rayonnement : la chaleur voyage à distance et enflamme ce qui est en face. Par projection : des brandons ou des gouttes enflammées allument un nouveau foyer.","Les fumées sont le premier danger pour les personnes : elles sont chaudes, opaques, mobiles, inflammables et toxiques. Le monoxyde de carbone, incolore et inodore, tue sans prévenir.","Deux phénomènes sont à connaître. Le flash-over est l'embrasement généralisé éclair : tout le local s'enflamme d'un coup. Le backdraft est une explosion de fumées, provoquée par un apport d'air brutal dans un local fermé où le feu manque d'oxygène. D'où la règle : on n'ouvre pas une porte chaude."],k:"Conduction, convection, rayonnement, projection. Les fumées tuent avant les flammes."},
 {h:"Comment on l'éteint",p:["Refroidir : on abaisse la température, c'est le rôle de l'eau. Étouffer : on prive le feu d'oxygène, avec le CO2, une couverture ou un couvercle. Isoler : on sépare le combustible du foyer, par exemple en fermant une vanne de gaz. Inhiber : on bloque la réaction chimique de la flamme, c'est l'action de la poudre.","Le choix de l'agent dépend de la classe. Eau pulvérisée avec additif : classes A et B. CO2 : classe B et feux d'origine électrique. Poudre ABC : polyvalente. Sur une friteuse en feu, jamais d'eau : on étouffe."],k:"Refroidir, étouffer, isoler, inhiber. Le bon agent pour la bonne classe."}
]},
{intro:"Savoir classer un bâtiment, c'est savoir quelles règles s'y appliquent.",s:[
 {h:"Qu'est-ce qu'un ERP",p:["Un établissement recevant du public est un bâtiment, un local ou une enceinte où des personnes sont admises, librement ou contre paiement, ou dans lequel se tiennent des réunions ouvertes. Le public, ce sont toutes les personnes admises en plus du personnel.","Chaque ERP est classé deux fois : par type, selon son activité, et par catégorie, selon son effectif."],k:"Un ERP a un type (activité) et une catégorie (effectif)."},
 {h:"Les types",p:["Les types courants portent une lettre : J structures pour personnes âgées et handicapées, L salles de spectacles et de conférences, M magasins et centres commerciaux, N restaurants et débits de boissons, O hôtels, P salles de danse et de jeux, R enseignement, S bibliothèques, T salles d'exposition, U établissements de soins, V lieux de culte, W administrations, banques et bureaux, X établissements sportifs couverts, Y musées.","Les types spéciaux portent plusieurs lettres : PA plein air, CTS chapiteaux, tentes et structures, SG structures gonflables, PS parcs de stationnement couverts, OA hôtels-restaurants d'altitude, GA gares, EF établissements flottants, REF refuges de montagne."],k:"Un centre commercial est un type M. Les types spéciaux ont plusieurs lettres."},
 {h:"Les catégories",p:["1re catégorie : plus de 1 500 personnes. 2e : de 701 à 1 500. 3e : de 301 à 700. 4e : 300 personnes et moins, sauf les établissements de 5e catégorie. 5e : établissements sous le seuil fixé pour leur type, par exemple 200 personnes pour un magasin.","Les catégories 1 à 4 forment le 1er groupe : on y compte le public et le personnel. La 5e catégorie forme le 2e groupe : on n'y compte que le public."],k:"1 500, 700, 300. 1er groupe : public + personnel. 5e catégorie : public seul."},
 {h:"Les IGH",p:["Un immeuble de grande hauteur est un bâtiment dont le plancher bas du dernier niveau est à plus de 50 m du sol pour l'habitation, et à plus de 28 m pour tous les autres usages. Au-delà de 200 m, on parle d'ITGH.","Les classes : GHA habitation, GHO hôtel, GHR enseignement, GHS archives, GHU sanitaire, GHW bureaux, GHZ usage mixte.","Le principe de sécurité d'un IGH est le compartimentage : l'immeuble est découpé en compartiments de 2 500 m² au plus, qui doivent contenir le feu. On évacue d'abord le compartiment sinistré, pas tout l'immeuble."],k:"IGH : 50 m en habitation, 28 m ailleurs. Compartiment : 2 500 m²."}
]},
{intro:"Un bâtiment doit résister assez longtemps pour que tout le monde sorte.",s:[
 {h:"Le comportement au feu",p:["Deux notions à ne pas confondre. La réaction au feu dit comment un matériau alimente le feu : de M0, incombustible, à M4, facilement inflammable. En classement européen, A1 correspond à incombustible.","La résistance au feu dit combien de temps un élément de construction joue son rôle. Stable au feu : il garde sa résistance mécanique. Pare-flammes : il est en plus étanche aux flammes et aux gaz. Coupe-feu : il est en plus isolant, la face opposée ne chauffe pas. Ces durées s'expriment en heures ou fractions d'heure."],k:"Réaction = le matériau. Résistance = l'élément. Coupe-feu = stable + étanche + isolant."},
 {h:"Les dégagements",p:["Un dégagement est tout ce qui permet de sortir : portes, couloirs, escaliers, sorties. Sa largeur se compte en unités de passage de 0,60 m, avec deux exceptions : 1 UP vaut 0,90 m et 2 UP valent 1,40 m.","Le nombre et la largeur dépendent de l'effectif. Moins de 20 personnes : un dégagement d'une UP. De 101 à 500 personnes : deux dégagements, et un nombre d'UP égal au nombre de centaines, arrondi au-dessus, plus une.","Les dégagements doivent être répartis, toujours libres et balisés. Au-delà de 50 personnes, les portes s'ouvrent dans le sens de la sortie. Les personnes qui ne peuvent pas évacuer seules rejoignent un espace d'attente sécurisé (EAS)."],k:"UP 0,60 m ; 1 UP 0,90 m ; 2 UP 1,40 m. Des sorties libres, réparties, balisées."},
 {h:"Le désenfumage",p:["Il extrait les fumées et la chaleur au début de l'incendie. Objectifs : garder les cheminements praticables pour l'évacuation, limiter la propagation et faciliter le travail des secours.","Il fonctionne par balayage : des amenées d'air en partie basse, des évacuations de fumées en partie haute. Il est naturel (ouvrants, exutoires en toiture) ou mécanique (ventilateurs). Les grands volumes sont découpés en cantons de 1 600 m² au plus par des écrans de cantonnement."],k:"Désenfumer pour évacuer. Naturel ou mécanique. Canton : 1 600 m²."},
 {h:"Éclairage et accès des secours",p:["L'éclairage de sécurité prend le relais quand l'éclairage normal tombe. Il a deux fonctions : l'évacuation, qui balise les sorties et les cheminements, et l'ambiance, qui évite la panique avec 5 lumens par m². Il tient au moins une heure.","Les secours doivent pouvoir approcher. Une voie engins fait 3 m de large, 3,50 m de hauteur libre et supporte 160 kilonewtons. Une voie échelle est une portion de voie engins de 4 m de large sur 10 m de long au moins, pour dresser les échelles."],k:"Éclairage de sécurité : 1 heure. Voie engins 3 m, voie échelle 4 m."}
]},
{intro:"Le SSI détecte, informe et met le bâtiment en sécurité. C'est l'outil du poste de sécurité.",s:[
 {h:"La logique du SSI",p:["Un système de sécurité incendie collecte les informations liées à l'incendie, les traite et commande la mise en sécurité. Il existe cinq catégories, de A (la plus complète) à E.","Le SSI de catégorie A comprend deux parties. Le SDI, système de détection incendie, voit le feu. Le SMSI, système de mise en sécurité incendie, agit sur le bâtiment."],k:"SSI A = SDI (détecter) + SMSI (mettre en sécurité)."},
 {h:"La détection",p:["Le SDI regroupe les détecteurs automatiques, les déclencheurs manuels et l'équipement de contrôle et de signalisation (ECS), qui reçoit et affiche les informations.","Les détecteurs réagissent à un phénomène : la fumée (détecteur optique, le plus courant), la chaleur (thermique, ou thermovélocimétrique s'il mesure la vitesse de montée en température) ou la flamme. Les déclencheurs manuels sont placés à chaque niveau, près des escaliers et des sorties, à 1,30 m du sol environ.","Au tableau, le voyant vert indique la mise sous tension, le rouge un feu, le jaune un dérangement."],k:"Détecteurs + déclencheurs manuels + ECS. Vert tension, rouge feu, jaune dérangement."},
 {h:"La mise en sécurité",p:["Le SMSI comprend le centralisateur de mise en sécurité incendie (CMSI), les dispositifs actionnés de sécurité (DAS) et l'équipement d'alarme avec son unité de gestion d'alarme (UGA).","Quatre fonctions : le compartimentage (portes et clapets coupe-feu se ferment), le désenfumage (volets et exutoires s'ouvrent), l'évacuation (alarme, déverrouillage des issues) et l'arrêt de certaines installations techniques.","Le bâtiment est découpé en zones : ZD pour la détection, ZA pour l'alarme, ZC pour le compartimentage, ZF pour le désenfumage, ZS pour la mise en sécurité."],k:"Compartimentage, désenfumage, évacuation, arrêt technique. ZC ferme, ZF désenfume."},
 {h:"L'alarme et l'exploitation",p:["Les équipements d'alarme vont du type 1, associé au SSI de catégorie A, au type 4, le plus simple. Le SSI B va avec le type 2a.","Quand un détecteur se déclenche, l'alarme restreinte prévient le poste de sécurité. Une temporisation de 5 minutes au plus laisse le temps de la levée de doute. L'alarme générale, elle, ordonne l'évacuation et dure au moins 5 minutes.","L'exploitant travaille au niveau d'accès 2 : acquittement, réarmement, commandes manuelles. Le réarmement se fait dans l'ordre : l'ECS, puis le CMSI, puis la remise des DAS en position d'attente."],k:"Restreinte : 5 minutes maximum. Générale : 5 minutes minimum. Réarmer ECS, puis CMSI."}
]},
{intro:"Les moyens d'extinction et tout ce qui aide les sapeurs-pompiers.",s:[
 {h:"Les extincteurs",p:["C'est le moyen de première intervention. Un extincteur portatif pèse 20 kg au plus. Le code du travail demande au moins un appareil de 6 litres à eau pulvérisée pour 200 m² de plancher, avec un minimum d'un par niveau. Ils sont vérifiés tous les ans.","On choisit l'appareil selon le feu : eau pulvérisée avec additif pour les classes A et B, CO2 pour les feux d'origine électrique et la classe B, poudre ABC en polyvalent.","Pour l'utiliser : dégoupiller, faire un essai bref, s'approcher dos à la sortie et viser la base des flammes."],k:"6 litres pour 200 m², un par niveau, contrôle annuel. Viser la base des flammes."},
 {h:"Les RIA",p:["Le robinet d'incendie armé est un tuyau semi-rigide sur dévidoir, toujours en eau, qu'une seule personne peut mettre en œuvre. Il existe en diamètres 19/6, 25/8 et 33/12.","La pression doit atteindre au moins 2,5 bars au RIA le plus défavorisé. Les RIA sont placés près des accès, de façon que toute la surface soit atteinte par un jet."],k:"RIA : toujours en eau, une seule personne, 2,5 bars."},
 {h:"Colonnes et hydrants",p:["Une colonne sèche est une canalisation vide installée dans un escalier. Les sapeurs-pompiers l'alimentent depuis leur engin et se branchent à l'étage. Elle est imposée quand le plancher bas du dernier niveau dépasse 18 m, et son raccord doit se trouver à moins de 60 m d'un point d'eau.","Une colonne en charge, dite humide, est toujours en eau et sous pression. On la trouve dans les IGH de plus de 50 m.","Dehors, un poteau d'incendie de 100 mm débite 60 m3 par heure sous 1 bar. Rouge : sous pression. Bleu : aspiration. Jaune : surpressé."],k:"Colonne sèche : 18 m, 60 m d'un point d'eau. Colonne humide : IGH de plus de 50 m."},
 {h:"L'extinction automatique",p:["Le sprinkleur détecte, alerte et attaque le feu seul. Chaque tête est fermée par une ampoule qui éclate à une température donnée : 68 °C pour une ampoule rouge. Seules les têtes touchées par la chaleur s'ouvrent. En zone de gel, le réseau est sous air.","Dans les locaux sensibles, comme une salle informatique, on utilise un gaz. Un signal et une temporisation laissent le temps d'évacuer avant l'émission."],k:"Sprinkleur : seules les têtes chauffées s'ouvrent. Ampoule rouge : 68 °C."}
]},
{intro:"Qui décide, qui contrôle, quels textes s'appliquent.",s:[
 {h:"Les textes",p:["Les règles des ERP et des IGH figurent dans le code de la construction et de l'habitation. Elles sont détaillées par des arrêtés : le règlement de sécurité des ERP du 25 juin 1980, le règlement des IGH du 30 décembre 2011, et l'arrêté du 2 mai 2005 qui organise les emplois et les diplômes SSIAP.","Le règlement ERP est découpé en livres d'articles repérés par deux lettres : GN généralités, CO construction, AM aménagements, DF désenfumage, CH chauffage, GZ gaz, EL électricité, EC éclairage, AS ascenseurs, GC grandes cuisines, MS moyens de secours."],k:"ERP : 25 juin 1980. IGH : 30 décembre 2011. SSIAP : 2 mai 2005."},
 {h:"Prévention et prévision",p:["La prévention regroupe tout ce qui empêche le feu de naître et de s'étendre, permet l'évacuation du public et facilite l'intervention des secours.","La prévision prépare la lutte contre le sinistre : moyens de secours, plans, consignes, entraînement des équipes."],k:"Prévention : éviter et limiter. Prévision : se préparer à intervenir."},
 {h:"Les acteurs",p:["L'exploitant est responsable de la sécurité dans son établissement. Le maire autorise l'ouverture par arrêté et peut ordonner la fermeture. Le préfet peut agir à sa place.","La commission de sécurité étudie les dossiers et visite les établissements : visite de réception avant l'ouverture, visites périodiques ensuite, visites inopinées. Elle rend un avis, favorable ou défavorable. C'est le maire qui décide. La commission départementale (CCDSA) est présidée par le préfet, la commission d'arrondissement par le sous-préfet, la commission communale par le maire.","Le registre de sécurité garde la trace de tout : personnel chargé du service incendie, consignes, dates et observations des vérifications, travaux."],k:"La commission donne un avis, le maire décide, l'exploitant est responsable."},
 {h:"Le service de sécurité et les SSIAP",p:["Le service de sécurité incendie compte au moins trois personnes présentes en même temps, dont un chef d'équipe. SSIAP 1 : agent. SSIAP 2 : chef d'équipe. SSIAP 3 : chef de service.","La formation SSIAP 2 dure 70 heures hors examen. Pour y entrer : le SSIAP 1, 1 607 heures comme agent sur les 24 derniers mois, un secourisme à jour et un certificat médical de moins de 3 mois.","Le diplôme s'entretient par un recyclage tous les 3 ans (14 heures pour le SSIAP 2). Si la date est dépassée, ou sans 1 607 heures d'activité sur 36 mois, il faut une remise à niveau de 21 heures."],k:"3 personnes dont un chef d'équipe. Recyclage 14 h tous les 3 ans, remise à niveau 21 h."}
]},
{intro:"Le chef d'équipe fait le lien entre le chef de service et les agents.",s:[
 {h:"Le rôle du SSIAP 2",p:["Le chef d'équipe encadre l'équipe de sécurité et dirige le poste de sécurité lors d'un sinistre. Ses missions : manager l'équipe, former le personnel à la sécurité incendie, assurer la prévision technique, l'entretien élémentaire des moyens de secours, l'assistance aux personnes, et faire respecter l'hygiène et la sécurité du travail en matière d'incendie.","Il rend compte à sa hiérarchie. Le budget et le conseil au chef d'établissement relèvent du chef de service, SSIAP 3."],k:"Encadrer, former, diriger le poste en cas de sinistre, rendre compte."},
 {h:"Manager l'équipe",p:["Il existe quatre styles : directif (on ordonne et on contrôle), persuasif (on explique), participatif (on décide ensemble), délégatif (on confie). On choisit selon l'agent et la situation. En urgence, le style est directif : des ordres courts, nominatifs, vérifiés.","Une consigne doit être claire et précise, et on s'assure qu'elle est comprise en la faisant reformuler. Déléguer une tâche ne retire pas la responsabilité de contrôler le résultat.","Un recadrage se fait en privé et sur des faits. Un conflit se traite tôt, en écoutant chacun."],k:"Urgence : directif. Consigne : claire, précise, reformulée."},
 {h:"Former",p:["Former le personnel fait partie de la mission. Une séquence se prépare : un objectif précis et mesurable, un plan, des méthodes et une évaluation.","Les méthodes : expositive (on explique), démonstrative (on montre puis on fait faire), interrogative (on fait trouver par des questions), active (on met en situation). À la fin, on vérifie que l'objectif est atteint."],k:"Un objectif mesurable, une méthode adaptée, une vérification."},
 {h:"Les règles de travail et les écrits",p:["Quelques repères du code du travail : 11 heures de repos consécutives par jour, 48 heures de travail au plus sur une semaine, un exercice d'évacuation au moins tous les 6 mois, un accident du travail déclaré par l'employeur sous 48 heures, un droit de retrait en cas de danger grave et imminent. Les EPI sont fournis par l'employeur.","Tout travail par point chaud demande un permis de feu, établi avant les travaux par le chef d'établissement ou son représentant. On surveille pendant et au moins 2 heures après.","La main courante note tous les événements dans l'ordre chronologique. Un compte rendu répond à : qui, quoi, où, quand, comment, pourquoi."],k:"Permis de feu avant, surveillance 2 heures après. Main courante : tout, dans l'ordre."}
]},
{intro:"C'est le cœur de l'épreuve pratique : gérer le PC quand tout arrive en même temps.",s:[
 {h:"Le poste de sécurité",p:["Le poste centralise les alarmes, les moyens de communication, les plans, les clés et les consignes. Il est occupé en permanence par au moins un agent pendant la présence du public.","Deux mots à ne jamais confondre. L'alarme prévient les occupants. L'alerte prévient les secours."],k:"Alarme : les occupants. Alerte : les secours."},
 {h:"Traiter une alarme feu",p:["Au signal : acquitter le son, lire la zone, noter l'heure, envoyer un agent en levée de doute avec une radio et un extincteur. La levée de doute, c'est aller vérifier sur place si le sinistre est réel.","Si le feu est confirmé : alarme générale tout de suite, sans attendre la fin de la temporisation, puis alerte des secours. Si l'agent peut attaquer le feu sans se mettre en danger, il le fait. Sinon il ferme la porte et fait évacuer.","Si l'alarme n'est pas confirmée : on cherche la cause, on réarme et on note."],k:"Lire, envoyer, confirmer, évacuer, alerter."},
 {h:"Alerter et accueillir les secours",p:["Le message d'alerte donne l'adresse précise, la nature du sinistre, le nombre et l'état des victimes, les risques particuliers et les mesures déjà prises. On ne raccroche que quand l'opérateur le demande. Numéros : 18 pompiers, 15 SAMU, 17 police, 112 numéro européen, 114 par SMS pour les personnes sourdes et malentendantes.","Un agent attend les secours au point d'accès avec les plans, les clés et une radio. À leur arrivée, le commandant des opérations de secours (COS) dirige. Le chef d'équipe lui rend compte : où, quoi, victimes, actions menées, fluides coupés. Le service de sécurité se met à sa disposition."],k:"Adresse d'abord. À l'arrivée des secours, le COS commande."},
 {h:"Les autres événements",p:["Évacuation : les guide-files mènent, les serre-files vérifient que personne ne reste, tout le monde rejoint le point de rassemblement.","Malaise : protéger, examiner, faire alerter, secourir. Personne bloquée en ascenseur : établir le contact, rassurer, appeler l'ascensoriste, aucune manœuvre sans formation. Odeur de gaz : ne toucher à aucun interrupteur, couper le gaz, aérer, évacuer. Alerte à la bombe : noter les propos, prévenir la police.","Dérangement au tableau ou zone coupée pour travaux : noter, prévenir la maintenance, organiser des rondes en compensation.","Après un sinistre : réarmer quand tout est terminé, remettre les moyens en état, remplir la main courante et rédiger le compte rendu."],k:"Un dérangement se compense par des rondes. Tout finit dans la main courante."}
]}
];
/* cas pratiques : e = étapes {s situation, o [bonne, fausse, fausse], f explication} */
var CAS=[
{n:"Feu dans une réserve",intro:"Samedi, 15 h 10. Tu es chef de poste dans un centre commercial plein. Deux agents sont en ronde.",e:[
 {s:"Le tableau affiche un feu en zone de détection « réserve boutique 24 ». L'alarme restreinte sonne au poste.",o:["Tu acquittes le son, tu lis la zone et tu envoies un agent en levée de doute avec radio et extincteur","Tu réarmes le tableau pour voir si l'alarme revient","Tu déclenches tout de suite l'évacuation générale du centre"],f:"On vérifie d'abord sur place. La temporisation est faite pour ça."},
 {s:"L'agent arrive devant la réserve : de la fumée noire sort sous la porte, qui est chaude.",o:["Alarme générale immédiate, puis alerte des secours","Tu attends la fin des 5 minutes de temporisation","Tu lui demandes d'ouvrir la porte pour voir le foyer"],f:"Feu confirmé : on n'attend pas. Et on n'ouvre jamais une porte chaude."},
 {s:"Tu as les sapeurs-pompiers au téléphone.",o:["Tu donnes l'adresse précise, la nature du feu, s'il y a des victimes, les mesures prises, et tu attends qu'on te dise de raccrocher","Tu dis « feu au centre commercial » et tu raccroches vite pour gagner du temps","Tu passes le téléphone à un client pendant que tu gères le tableau"],f:"Adresse d'abord. On ne raccroche que sur demande de l'opérateur."},
 {s:"Sur place, l'agent te demande quoi faire en attendant.",o:["Laisser la porte fermée, faire évacuer la boutique et les voisines, tenir un périmètre","Entrer dans la réserve avec son extincteur","Revenir au poste"],f:"Porte fermée = feu contenu. Sa mission devient l'évacuation et la sécurité des personnes."},
 {s:"Le premier engin arrive.",o:["Un agent l'attend à l'accès avec plans et clés, et tu rends compte au COS : lieu, nature, victimes, actions menées","Tu laisses les pompiers trouver seuls, ils connaissent le site","Tu continues à diriger les opérations, c'est ton site"],f:"Le COS commande. Le service de sécurité se met à sa disposition."},
 {s:"Le feu est éteint, les pompiers lèvent le dispositif.",o:["Tu réarmes l'ECS puis le CMSI, tu remets les DAS en attente, et tu rédiges main courante et compte rendu","Tu réarmes d'abord les DAS, le reste suivra","Tu rentres chez toi, le compte rendu attendra lundi"],f:"ECS, CMSI, puis DAS. Et l'écrit se fait à chaud."}
]},
{n:"Travaux par point chaud",intro:"Mardi, 8 h. Une entreprise extérieure vient réparer une rampe métallique dans une galerie technique.",e:[
 {s:"Le soudeur est déjà en train d'installer son poste. Aucun document ne t'a été remis.",o:["Tu fais stopper : pas de point chaud sans permis de feu établi avant les travaux","Tu le laisses commencer, le permis sera fait à la pause","Tu lui demandes juste de faire attention"],f:"Le permis de feu se fait avant, avec le représentant du chef d'établissement et l'intervenant."},
 {s:"Le permis est en cours de rédaction. Il faut préparer la zone.",o:["Éloigner ou protéger les combustibles, placer un extincteur à portée, repérer les détecteurs proches","Arroser le sol à grande eau","Rien, le soudeur est un professionnel"],f:"On prépare la zone et le moyen d'extinction avant la première étincelle."},

  if(extra&&extra.me&&!S.me)Object.assign(S,extra);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pad(n){return n<10?"0"+n:""+n;}
function dayStr(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function daysTo(y,m,d){var a=new Date();a.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-a)/864e5);}
function rng(seed){var h=1779033703;for(var i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
function shuffle(a,r){a=a.slice();r=r||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allIds(){return Q.map(function(_,i){return i;});}
function other(){return S.me==="r"?"l":"r";}
function mastery(t){var n=0,ok=0,seen=0;Q.forEach(function(q,i){if(t==null||q[0]===t){n++;if(S.res[i]===1)ok++;if(i in S.res)seen++;}});return{n:n,ok:ok,seen:seen,pc:Math.round(ok/n*100)};}
function led(m){if(!m.seen)return"";if(m.pc>=80)return"g";if(m.seen>=5&&m.ok/m.seen<.5)return"r";return"a";}
function rank(xp){return xp>=1500?"Patron du PC":xp>=800?"Chef de poste":xp>=300?"Chef d'équipe":"Agent en ronde";}
function code(){var d=S.daily[dayStr()];return["S2",S.me.toUpperCase(),S.xp.toString(36),S.streak.toString(36),S.exam.toString(36),mastery().pc.toString(36),dayStr().slice(5).replace("-",""),d==null?"x":d.toString(36)].join("-").toUpperCase();}
function parseCode(s){var p=String(s).trim().toUpperCase().split("-");if(p.length!==8||p[0]!=="S2")return null;var w=p[1].toLowerCase();if(w!=="r"&&w!=="l")return null;
  var n=function(x){var v=parseInt(x,36);return isFinite(v)?v:0;};
  return{who:w,xp:n(p[2]),streak:n(p[3]),exam:n(p[4]),pc:Math.min(100,n(p[5])),day:p[6],daily:p[7]==="X"?null:n(p[7]),at:dayStr()};}
function touchStreak(){var t=dayStr();if(S.last===t)return;var y=new Date();y.setDate(y.getDate()-1);S.streak=S.last===dayStr(y)?S.streak+1:1;S.last=t;if(S.streak>S.best)S.best=S.streak;}

  app.innerHTML='<div class="top"><div class="brand">'+esc(c.n)+'</div><button class="link" data-act="quit">Abandonner</button></div><div class="meta"><span>Décision</span><span class="num">'+(cur.i+1)+'/'+n+'</span></div><div class="bar"><i style="width:'+(cur.i/n*100)+'%"></i></div>'+
  (cur.i===0?'<p class="muted">'+esc(c.intro)+'</p>':"")+'<p class="q">'+esc(e.s)+'</p><div class="rows">'+cur.ord.map(function(o,ix){var k="opt";if(p!=null){if(o===0)k+=" ok";else if(o===p)k+=" ko";}return'<button class="'+k+'" data-casopt="'+o+'"'+(p!=null?" disabled":"")+'><span class="ltr">'+"ABC"[ix]+'</span><span>'+esc(e.o[o])+'</span></button>';}).join("")+'</div>'+
  (p!=null?'<div class="note"><b>'+(p===0?"Bonne décision.":"Mauvaise décision.")+'</b> '+esc(e.f)+'</div><button class="btn go" data-act="cnext"><span class="t">'+(cur.i+1<n?"Étape suivante":"Voir le résultat")+'</span><span class="arrow">→</span></button>':"");
}
function casEnd(){var i=cur.c,c=CAS[i],ok=cur.ok,n=c.e.length,gain=ok*15+(ok===n?25:0);if(S.cas[i]==null||ok>S.cas[i])S.cas[i]=ok;bank("cas",c.n,ok,n,gain,true);
  cur={done:{title:c.n,ring:ring(ok,n),unit:ok===n?"PC tenu sans une erreur.":"Rejoue le cas : les bonnes décisions doivent devenir des réflexes.",gain:gain,lines:[],again:"cas",arg:i}};view={name:"done"};render();}
/* ---------- défis ---------- */
function startDefi(seed,vs){var sd=seed||Math.random().toString(36).slice(2,6).toUpperCase();
  start(shuffle(allIds(),rng("df"+sd)).slice(0,10),"defi",vs==null?"Défi lancé":"Défi de "+P[other()].n);cur.seed=sd;cur.vs=vs==null?null:vs;}
function defiBlock(){
  if(cur.mode!=="defi")return"";var o=P[other()].n;
  if(cur.vs!=null)return'<p><b>'+(cur.ok>cur.vs?"Défi gagné":cur.ok<cur.vs?"Défi perdu":"Égalité")+'.</b> Toi '+cur.ok+', '+esc(o)+' '+cur.vs+'.</p>';
  return'<p>Envoie ce code à '+esc(o)+'. Il jouera exactement les mêmes questions.</p><input class="code" id="mycode" readonly value="DF-'+cur.seed+'-'+S.me.toUpperCase()+'-'+cur.ok.toString(36).toUpperCase()+'"><button class="btn go" data-act="copy"><span class="t" id="copylbl">Copier le code du défi</span></button>';
}
function scores(msg){
  var o=P[other()].n,c=code();
  app.innerHTML=head(1)+'<h1>Codes et défis</h1>'+
  '<section class="panel"><h2>Mon code de score</h2><p class="small muted">Envoie-le à '+esc(o)+' par message. Il le colle dans son appli et voit tes points, tes records et ta courbe.</p><input class="code" id="mycode" readonly value="'+esc(c)+'"><button class="btn go" data-act="copy"><span class="t" id="copylbl">Copier mon code</span></button></section>'+
  '<section class="panel"><h2>Un code de '+esc(o)+'</h2><label class="small muted" for="hiscode">Colle ici son code de score (S3-…) ou son code de défi (DF-…).</label><input class="code" id="hiscode" autocomplete="off" autocapitalize="characters" placeholder="S3-… ou DF-…"><button class="btn" data-act="paste"><span class="t">Valider le code</span></button>'+(typeof msg==="string"?'<p class="note">'+esc(msg)+'</p>':"")+'</section>'+
  '<section class="panel"><h2>Défis</h2><p class="num">'+S.dw+' gagné'+(S.dw>1?"s":"")+', '+S.dl+' perdu'+(S.dl>1?"s":"")+', '+S.dn+' nul'+(S.dn>1?"s":"")+'.</p><p class="small muted">Tu joues 10 questions, tu envoies le code, '+esc(o)+' joue les mêmes. Le gagnant prend 50 points.</p><button class="btn go" data-act="defi"><span class="t">Lancer un défi</span><span class="arrow">→</span></button></section>';
}
/* ---------- classement ---------- */
function classement(){
  var a=myStats(),b=hisStats(),o=other(),R=S.me==="r"?a:b,L=S.me==="l"?a:b;
  var rows=[["Points","xp"],["Points cette semaine","wx"],["Programme acquis","pc"," %"],["Examen blanc","exam","/20"],["Contre-la-montre","c"],["Survie","s"],["Série de jours","streak"," j"],["Cours terminés","co"],["Cartes mémo sues","me"],["Défis gagnés","dw"]];
  var f=function(st,k,u){if(!st||st[k]==null)return"–";return(k==="exam"?(st[k]/2).toLocaleString("fr-FR"):st[k])+(u||"");};
  var wr=0,wl=0,body=rows.map(function(r){var x=R&&R[r[1]]!=null?R[r[1]]:null,y=L&&L[r[1]]!=null?L[r[1]]:null,cx="",cy="";if(x!=null&&y!=null){if(x>y){cx=' class="win"';wr++;}else if(y>x){cy=' class="win"';wl++;}}
    return"<tr><td>"+r[0]+"</td><td"+cx+">"+f(R,r[1],r[2])+"</td><td"+cy+">"+f(L,r[1],r[2])+"</td></tr>";}).join("");
  app.innerHTML=head(1)+'<h1>Classement</h1>'+
  '<section class="panel">'+(b?'<div class="ring" style="justify-content:space-between"><div class="who"><span class="av" style="background:var(--s1)">R</span><span class="score num">'+wr+'</span></div><span class="muted">catégories</span><div class="who"><span class="score num">'+wl+'</span><span class="av" style="background:var(--s2)">L</span></div></div><p>'+(wr===wl?"Égalité au nombre de catégories.":(wr>wl?"Romain":"Logan")+" mène "+Math.max(wr,wl)+" à "+Math.min(wr,wl)+".")+'</p>':'<p>Il manque le code de '+esc(P[o].n)+' pour remplir sa colonne.</p>')+
  '<table><thead><tr><th>Catégorie</th><th>Romain</th><th>Logan</th></tr></thead><tbody>'+body+'</tbody></table>'+
  '<p class="small muted">'+(b?"Colonne de "+esc(P[o].n)+" : son code du "+fr(S.rival.at)+". ":"")+'Échangez vos codes pour mettre le tableau à jour.</p><button class="btn go" data-go="scores"><span class="t">Échanger les codes</span><span class="arrow">→</span></button></section>'+
  '<section class="panel"><h2>Face à face</h2><div class="row"><span>Défis à distance</span><span class="num"><b>'+S.dw+'</b> gagnés, <b>'+S.dl+'</b> perdus, '+S.dn+' nuls</span></div><div class="row"><span>Manches sur un téléphone</span><span class="num">Romain <b>'+S.duel.r+'</b> · Logan <b>'+S.duel.l+'</b></span></div></section>';
}

/* ---------- événements ---------- */
app.addEventListener("click",function(e){
  var tp=e.target.closest("[data-tip]");if(tp){var te=document.getElementById("tip");if(te)te.textContent=tp.dataset.tip;return;}
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.me){S.me=d.me;if(S.rival&&S.rival.who===S.me)S.rival=null;save();view={name:"home"};render();}
  else if(d.go){view={name:d.go};render();}
  else if(d.fiche!=null){view={name:"fiche",t:+d.fiche};render();}
  else if(d.train!=null){var ids;
    if(d.train==="all")ids=shuffle(allIds()).slice(0,10);
    else if(d.train==="err")ids=shuffle(allIds().filter(function(i){return S.res[i]===0;})).slice(0,10);
    else{var t=+d.train,pool=allIds().filter(function(i){return Q[i][0]===t;});
      var todo=shuffle(pool.filter(function(i){return S.res[i]!==1;})),okd=shuffle(pool.filter(function(i){return S.res[i]===1;}));ids=todo.concat(okd).slice(0,10);ids=shuffle(ids);}
    start(ids,"train",d.train==="all"?"Tout mélanger":d.train==="err"?"Mes erreurs":T[+d.train].n);}
  else if(d.opt!=null)answer(+d.opt);
  else if(d.duel)duelTap(d.duel,+d.o);
  else if(d.cours!=null){view={name:"cours",t:+d.cours};render();}
  else if(d.cas!=null)startCas(+d.cas);
  else if(d.rapid!=null)rapidTap(+d.rapid);
  else if(d.vf!=null){if(cur.pick==null){cur.pick=+d.vf;if((cur.pick===1)===cur.st[cur.i].t)cur.ok++;vf();}}
  else if(d.casopt!=null){if(cur.pick==null){cur.pick=+d.casopt;if(cur.pick===0)cur.ok++;cas();}}
  else if(d.act==="vnext"){cur.pick=null;cur.i++;if(cur.i>=cur.ids.length)vfEnd();else{window.scrollTo(0,0);vf();}}
  else if(d.act==="cnext"){cur.pick=null;cur.i++;cur.ord=shuffle([0,1,2]);if(cur.i>=CAS[cur.c].e.length)casEnd();else{window.scrollTo(0,0);cas();}}
  else if(d.act==="chrono"||d.act==="survie")startRapid(d.act);
  else if(d.act==="vf")startVF();
  else if(d.act==="cas")startCas(+d.arg);
  else if(d.act==="defi")startDefi();
  else if(d.act==="cquiz"){var ct=view.t,cp=shuffle(allIds().filter(function(i){return Q[i][0]===ct;}));cp.sort(function(a,b){return(S.res[a]===1?1:0)-(S.res[b]===1?1:0);});start(shuffle(cp.slice(0,5)),"cours","Cours : "+T[ct].n);cur.ct=ct;}
  else if(d.act==="next")next();
  else if(d.act==="memo")startMemo();
  else if(d.act==="flip"){cur.show=true;memo();}
  else if(d.memo!=null){S.memo[cur.ids[cur.i]]=+d.memo;if(+d.memo)cur.ok++;save();cur.i++;cur.show=false;memo();}
  else if(d.act==="dnext")duelNext();
  else if(d.act==="daily")start(shuffle(allIds(),rng("ssiap2-"+dayStr())).slice(0,10),"daily","Défi du jour");
  else if(d.act==="exam")start(shuffle(allIds()).slice(0,40),"exam","Examen blanc");
  else if(d.act==="duel")startDuel();
  else if(d.act==="quit"){cur=null;view={name:"home"};render();}
  else if(d.act==="switch"){S.me=null;save();render();}
  else if(d.act==="copy"){var inp=document.getElementById("mycode"),lbl=document.getElementById("copylbl");inp.select();
    var done=function(){lbl.textContent="Code copié";},fail=function(){lbl.textContent="Appuie longtemps sur le code pour le copier";};
    try{navigator.clipboard.writeText(inp.value).then(done,fail);}catch(err){fail();}}
  else if(d.act==="paste"){var raw=document.getElementById("hiscode").value,df=parseDefi(raw);
    if(df){if(df.who===S.me)scores("C'est ton propre défi. Envoie-le à "+P[other()].n+".");else if(S.seeds.indexOf(df.seed)>=0)scores("Tu as déjà joué ce défi.");else startDefi(df.seed,df.score);return;}
    var r=parseCode(raw);
    if(!r)scores("Ce code n'est pas reconnu. Il commence par S3- ou DF- et se copie en entier.");
    else if(r.who===S.me)scores("C'est ton propre code. Il faut celui de "+P[other()].n+".");
    else{S.rival=r;S.rh[r.at]={xp:r.xp,pc:r.pc};save();view={name:"home"};render();}}
});
app.addEventListener("mouseover",function(e){var tp=e.target.closest&&e.target.closest("[data-tip]");if(tp){var te=document.getElementById("tip");if(te)te.textContent=tp.dataset.tip;}});
function boot(data){load(data);render();}
try{if(window.claude&&window.claude.hot){window.claude.hot.snapshot(function(){return S;});}}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
</body>
</html>
