{t:5,n:"Le SSIAP 2 : programme, examen, recyclage",intro:"Ce que prévoit l'arrêté du 2 mai 2005 pour devenir et rester chef d'équipe.",s:[
 {h:"Entrer en formation",p:["Quatre conditions : avoir le SSIAP 1 ou une équivalence, justifier de 1 607 heures comme agent de sécurité incendie sur les 24 derniers mois (attestation de l'employeur ou contrat de travail), avoir un secourisme valide (PSC 1 de moins de 2 ans, ou SST ou PSE 1 en cours de validité) et un certificat médical de moins de 3 mois.","La formation dure au moins 70 heures, hors examen et hors déplacements, avec 12 stagiaires au plus par session, dans un centre agréé."],k:"SSIAP 1 + 1 607 h sur 24 mois + secourisme + certificat médical de moins de 3 mois."},
 {h:"Les quatre parties du programme",p:["Partie 1, 38 heures : rôles et missions du chef d'équipe. Neuf séquences : gestion de l'équipe, management de l'équipe, organisation d'une séance de formation, gestion des conflits, évaluation de l'équipe, information de la hiérarchie, application des consignes de sécurité, gestion des incidents techniques, délivrance du permis de feu.","Partie 2, 10 heures : manipulation des systèmes de sécurité incendie. Système de détection incendie, système de mise en sécurité incendie, installations fixes d'extinction automatique.","Partie 3, 6 heures : hygiène et sécurité du travail en matière de sécurité incendie. Réglementation du code du travail, commissions de sécurité et commissions d'accessibilité.","Partie 4, 16 heures : chef du poste central de sécurité en situation de crise. Gestion du poste central de sécurité, conseils techniques aux services de secours."],k:"38 h + 10 h + 6 h + 16 h = 70 heures."},
 {h:"L'examen",p:["Trois épreuves. Un QCM de 40 questions en 40 minutes, noté sur 20 : en dessous de 12, pas de diplôme. Une épreuve orale de 15 minutes : animer une séquence pédagogique. Une épreuve pratique de 20 minutes : un exercice de gestion du PC en situation de crise.","Le jury est présidé par un représentant des sapeurs-pompiers."],k:"QCM 40 questions en 40 minutes, oral 15 minutes, pratique 20 minutes."},
 {h:"Garder son diplôme",p:["Le SSIAP se recycle tous les 3 ans, au plus tard à la date anniversaire du diplôme : 14 heures pour le chef d'équipe. Le recyclage du SSIAP 2 comporte cinq séquences : prévention, moyens de secours, gestion du PC sécurité, organisation d'une séance de formation, l'équipe de sécurité incendie.","Le secourisme, lui, se recycle tous les 2 ans.","Si la date limite est dépassée, ou sans 1 607 heures d'activité sur les 36 derniers mois, il faut une remise à niveau : 21 heures pour le SSIAP 2."],k:"SSIAP tous les 3 ans, secourisme tous les 2 ans. Recyclage 14 h, remise à niveau 21 h."}
]},
{t:5,n:"Le règlement ERP : comment il est construit",intro:"Savoir où chercher une règle, c'est déjà la moitié de la réponse.",s:[
 {h:"Du code au règlement",p:["Le code de la construction et de l'habitation pose les principes. L'arrêté du 25 juin 1980 approuve le règlement de sécurité qui les détaille.","Le règlement est découpé en quatre livres. Livre I : dispositions communes à tous les ERP. Livre II : établissements des quatre premières catégories. Livre III : établissements de 5e catégorie. Livre IV : établissements spéciaux (plein air, chapiteaux, parkings, gares…)."],k:"Livre II pour le 1er groupe, livre III pour la 5e catégorie, livre IV pour les types spéciaux."},
 {h:"Les dispositions générales",p:["Dans le livre II, les dispositions générales valent pour tous les types. Chaque chapitre a ses lettres : GN classement et généralités, GE contrôles, CO construction et dégagements, AM aménagements intérieurs, DF désenfumage, CH chauffage et ventilation, GZ gaz, EL électricité, EC éclairage, AS ascenseurs, GC grandes cuisines, MS moyens de secours.","Viennent ensuite les dispositions particulières, propres à chaque type : articles M pour les magasins, L pour les salles de spectacles, et ainsi de suite. Elles complètent ou durcissent les règles générales."],k:"Générales d'abord (GN à MS), particulières ensuite (une lettre par type)."},
 {h:"Les contrôles",p:["Les établissements du 1er groupe sont visités par la commission de sécurité : avant l'ouverture, après des travaux, puis périodiquement. Depuis 2015, la périodicité est de 3 ou 5 ans selon le type et la catégorie. Pour un magasin (type M) : 3 ans en 1re et 2e catégorie, 5 ans en 3e et 4e catégorie.","Le maire ou le préfet peut toujours demander une visite inopinée. Les établissements de 5e catégorie sans locaux à sommeil ne sont visités que sur demande."],k:"Visites périodiques : 3 ou 5 ans. Type M : 3 ans en 1re et 2e catégorie."},
 {h:"L'exploitation",p:["L'exploitant tient un registre de sécurité : personnel chargé du service incendie, consignes, dates des contrôles et vérifications avec les observations, travaux.","La formation du personnel désigné pour la sécurité est conduite à l'initiative et sous la responsabilité de l'exploitant."],k:"Registre de sécurité et formation : c'est l'exploitant qui en répond."}
]},
{t:2,n:"ERP : les dégagements article par article",intro:"Les articles CO 34 à CO 60 fixent tout ce qui permet de sortir.",s:[
 {h:"L'unité de passage",p:["La largeur d'un dégagement est proportionnelle au nombre de personnes qui l'empruntent. Elle se calcule en unités de passage de 0,60 m. Deux exceptions : un dégagement d'une seule UP fait 0,90 m, un dégagement de 2 UP fait 1,40 m.","Au-delà de 200 personnes, aucun dégagement normal ne peut faire moins de 2 UP : on évite l'effet d'entonnoir."],k:"0,60 m, sauf 0,90 m pour 1 UP et 1,40 m pour 2 UP."},
 {h:"Combien de sorties",p:["De 1 à 19 personnes : un dégagement d'une UP. De 20 à 50 : deux dégagements, dont un peut être accessoire. De 51 à 100 : deux dégagements d'une UP, ou un de 2 UP complété par un dégagement accessoire.","Au-dessus de 100 personnes : deux dégagements jusqu'à 500 personnes, puis un dégagement de plus par 500 personnes ou fraction de 500 au-dessus des 500 premières."],k:"2 sorties jusqu'à 500 personnes, puis 1 de plus par tranche de 500."},
 {h:"Combien d'unités de passage",p:["Une UP pour 100 personnes ou fraction de 100. En dessous de 501 personnes, on ajoute une UP.","Exemples. 200 personnes : 2 + 1 = 3 UP, sur 2 dégagements. 301 personnes : 4 + 1 = 5 UP, sur 2 dégagements. 800 personnes : 8 UP, sans majoration, sur 3 dégagements. 1 200 personnes : 12 UP, sur 4 dégagements."],k:"Centaines arrondies au-dessus, + 1 jusqu'à 500 personnes."},
 {h:"Éclairage et balisage",p:["L'éclairage d'évacuation balise les cheminements : des blocs d'au moins 45 lumens, espacés de 15 m au plus dans les couloirs. L'éclairage d'ambiance évite la panique : 5 lumens par m² de surface du local.","L'ensemble fonctionne au moins 1 heure sur sa source de sécurité."],k:"Blocs de 45 lumens tous les 15 m. Ambiance : 5 lumens par m². Autonomie 1 heure."}
]},
{t:4,n:"ERP : les moyens de secours article par article",intro:"Les articles MS : extinction, aide aux pompiers, service de sécurité, SSI, alarme.",s:[
 {h:"Les extincteurs",p:["Dans les ERP du 1er groupe : des extincteurs à eau pulvérisée de 6 litres minimum, au moins un appareil pour 200 m² et par niveau, répartis de façon à ne jamais avoir plus de 15 m à parcourir pour en atteindre un, complétés par des appareils adaptés aux risques particuliers.","En 5e catégorie : au moins un extincteur pour 300 m² et un par niveau. Vérification annuelle dans tous les cas."],k:"1er groupe : 1 pour 200 m², 15 m maximum. 5e catégorie : 1 pour 300 m²."},
 {h:"RIA et colonnes",p:["Les RIA (articles MS 14 à 17) doivent permettre d'atteindre toute la surface des locaux. La pression se mesure sur l'appareil le plus défavorisé pendant qu'un deuxième RIA fonctionne : au moins 2,5 bars.","La colonne sèche concerne les établissements dont le plancher bas le plus élevé est à plus de 18 m de la voie accessible aux engins. Son raccord d'alimentation est à 60 m au plus d'une bouche ou d'un poteau d'incendie.","La colonne en charge est reliée à des réservoirs et à des pompes : 120 m3 d'eau disponibles en permanence, une pression entre 4,5 et 8,5 bars."],k:"RIA 2,5 bars avec deux appareils en service. Colonne sèche : 18 m et 60 m."},
 {h:"Le service de sécurité",p:["La surveillance est assurée pendant la présence du public (article MS 45). L'article MS 46 fixe la composition du service selon le type et la catégorie.","Quand il est assuré par des agents de sécurité incendie : trois personnes au moins présentes en même temps, dont un chef d'équipe. Le chef d'équipe et un agent au moins ne doivent pas être distraits de leurs missions. Les autres agents peuvent avoir d'autres tâches.","Missions : vacuité des dégagements, permanence au poste, rondes, tenue du registre, entretien élémentaire et vérification des moyens de secours, intervention et accueil des secours."],k:"3 personnes dont un chef d'équipe. Le chef et un agent restent sur leur mission."},
 {h:"SSI et alarme",p:["Le SSI (article MS 53) est classé de A à E, l'équipement d'alarme (article MS 62) de 1 à 4, par sévérité décroissante. Les dispositions de chaque type disent lequel installer.","L'alarme générale est audible partout pendant 5 minutes au moins. Les déclencheurs manuels sont à 1,30 m du sol, à chaque niveau près des escaliers, et au rez-de-chaussée près des sorties. L'alarme générale sélective ne prévient que certains personnels, par exemple dans un hôpital."],k:"Alarme générale : 5 minutes au moins. Déclencheurs à 1,30 m, près des escaliers et des sorties."}
]},
{t:1,n:"Le type M : magasins et centres commerciaux",intro:"Le type du site où tu travailles. Ses règles s'ajoutent aux dispositions générales.",s:[
 {h:"Classement",p:["Sont classés en type M les magasins de vente et les centres commerciaux. En dessous de 200 personnes au total (100 en sous-sol, 100 en étages), l'établissement est en 5e catégorie.","Au-dessus, on applique les catégories habituelles : plus de 1 500 personnes en 1re, de 701 à 1 500 en 2e, de 301 à 700 en 3e, jusqu'à 300 en 4e."],k:"Seuil de la 5e catégorie en type M : 200 personnes."},
 {h:"SSI et alarme selon la catégorie",p:["1re catégorie : SSI de catégorie B, alarme de type 2a. 2e catégorie : SSI de catégorie C, D ou E, alarme de type 2b. 3e catégorie : alarme de type 3. 4e catégorie : alarme de type 4.","Un centre commercial de 600 personnes est donc en 3e catégorie, avec une alarme de type 3."],k:"Type M : B et 2a en 1re catégorie, 2b en 2e, 3 en 3e, 4 en 4e."},
 {h:"Les visites",p:["La commission de sécurité passe tous les 3 ans dans les magasins de 1re et 2e catégorie, tous les 5 ans dans ceux de 3e et 4e catégorie."],k:"3 ans en 1re et 2e catégorie, 5 ans en 3e et 4e."},
 {h:"Ce que surveille le service de sécurité",p:["Dans un centre commercial, les points sensibles reviennent toujours : réserves encombrées, sorties de secours bloquées par des livraisons, portes coupe-feu calées, travaux par point chaud dans une boutique, stockage dans les circulations.","Chaque boutique a son exploitant, mais les parties communes et les moyens de secours collectifs relèvent du service de sécurité du centre."],k:"Réserves, sorties, portes coupe-feu, travaux : les quatre réflexes de ronde."}
]},
{t:1,n:"Les IGH : la réglementation",intro:"L'arrêté du 30 décembre 2011 et les principes du code de la construction.",s:[
 {h:"Définition et classes",p:["Un immeuble est de grande hauteur quand le plancher bas de son dernier niveau est à plus de 50 m (habitation) ou à plus de 28 m (autres usages) du sol le plus haut utilisable par les engins de secours. Au-delà de 200 m, c'est un ITGH.","Classes : GHA habitation, GHO hôtel, GHR enseignement, GHS dépôt d'archives, GHU sanitaire, GHW 1 bureaux de 28 à 50 m, GHW 2 bureaux de plus de 50 m, GHZ usages multiples, GHTC tours de contrôle.","Le règlement actuel est l'arrêté du 30 décembre 2011. Il a remplacé celui du 18 octobre 1977. Ses articles commencent par GH."],k:"50 m en habitation, 28 m ailleurs, 200 m pour l'ITGH. Articles GH."},
 {h:"Le compartimentage",p:["C'est le principe de base : le feu doit rester dans le compartiment où il est né. Un compartiment a la hauteur d'un niveau, 75 m de long au plus et 2 500 m² au plus. Il peut couvrir deux niveaux si la surface totale ne dépasse pas 2 500 m².","Les parois qui séparent les compartiments sont coupe-feu 2 heures. Des dispositions empêchent les fumées de passer du compartiment sinistré au reste de l'immeuble."],k:"Compartiment : 1 niveau, 75 m, 2 500 m², parois coupe-feu 2 heures."},
 {h:"Limiter ce qui brûle, permettre de sortir",p:["Les matériaux qui propagent vite le feu sont interdits et la quantité de matières combustibles est limitée : le potentiel calorifique du mobilier reste en dessous de 400 mégajoules par m² en moyenne par compartiment, soit environ 25 kg de bois par m².","Chaque compartiment est desservi par deux escaliers au moins. L'accès aux ascenseurs est interdit dans les compartiments atteints ou menacés par l'incendie.","L'immeuble dispose de sources d'électricité autonomes pour ses installations de sécurité, et il est isolé de son voisinage par des parois coupe-feu 2 heures ou par un volume de protection."],k:"400 MJ par m², 2 escaliers par compartiment, pas d'ascenseur dans le compartiment sinistré."},
 {h:"Le service de sécurité en IGH",p:["Le poste de sécurité est obligatoire et le service de sécurité incendie est présent 24 heures sur 24, avec des agents qualifiés. Pendant les heures d'occupation, une équipe locale de sécurité est désignée dans chaque compartiment.","Les moyens de secours sont renforcés : SSI (article GH 49), colonnes sèches (GH 54), colonnes en charge (GH 55).","Le règlement de 2011 a aussi introduit la notion d'évacuation immédiate et générale de l'immeuble, là où l'on se limitait auparavant à l'étage sinistré et aux étages juste au-dessus et au-dessous."],k:"Service 24 heures sur 24, poste de sécurité obligatoire, équipe locale par compartiment."}
]}
]);

  GUIDE.map(function(g){return'<h2 class="sec">'+esc(g[0])+'</h2><div class="rows">'+g[1].map(function(i){var d=S.read[i];return'<button class="btn" data-cours="'+i+'"><span class="theme"><span class="led '+(d!=null?"g":"")+'"></span><span><span class="t">'+esc(cname(i))+'</span><br><span class="d">'+esc(C[i].intro)+'</span></span></span><span class="arrow">→</span></button>';}).join("")+'</div>';}).join("")+
  (src>=0?'<div class="rows"><button class="btn" data-fiche="'+src+'"><span class="t">Sources des cours</span><span class="arrow">→</span></button></div>':"");
}
/* ---------- événements ---------- */
app.addEventListener("click",function(e){
  var tp=e.target.closest("[data-tip]");if(tp){var te=document.getElementById("tip");if(te)te.textContent=tp.dataset.tip;return;}
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.me){pickMe(d.me);view={name:"home"};render();}
  else if(d.defi){var dd=net.defis[d.defi];if(dd&&goodSeed(d.defi))startDefi(d.defi,Math.max(0,Math.min(10,+dd.a||0)));}
  else if(d.go){view={name:d.go};render();}
  else if(d.fiche!=null){view={name:"fiche",t:+d.fiche};render();}
  else if(d.train!=null){var ids;
    if(d.train==="all")ids=shuffle(allIds()).slice(0,10);
    else if(d.train==="err")ids=shuffle(allIds().filter(function(i){return S.res[i]===0;})).slice(0,10);
    else{var t=+d.train,pool=allIds().filter(function(i){return Q[i][0]===t;});
      var todo=shuffle(pool.filter(function(i){return S.res[i]!==1;})),okd=shuffle(pool.filter(function(i){return S.res[i]===1;}));ids=todo.concat(okd).slice(0,10);ids=shuffle(ids);}
    start(ids,"train",d.train==="all"?"Tout mélanger":d.train==="err"?"Mes erreurs":T[+d.train].n);if(d.train!=="all"&&d.train!=="err")cur.th=+d.train;}
  else if(d.hub!=null){view={name:"hub",t:+d.hub};render();}
  else if(d.piege!=null)start(shuffle(trapIds(+d.piege)).slice(0,10),"piege","Pièges : "+T[+d.piege].n);
  else if(d.act==="piege")start(shuffle(trapIds()).slice(0,10),"piege","Questions pièges");
  else if(d.opt!=null)answer(+d.opt);
  else if(d.duel)duelTap(d.duel,+d.o);
  else if(d.cours!=null){view={name:"cours",t:+d.cours};render();}
  else if(d.cas!=null)startCas(+d.cas);
  else if(d.rapid!=null)rapidTap(+d.rapid);
  else if(d.vf!=null){if(cur.pick==null){cur.pick=+d.vf;if((cur.pick===1)===cur.st[cur.i].t)cur.ok++;vf();}}
  else if(d.casopt!=null){if(cur.pick==null){cur.pick=+d.casopt;if(cur.pick===0)cur.ok++;cas();}}
  else if(d.act==="vnext"){cur.pick=null;cur.i++;if(cur.i>=cur.ids.length)vfEnd();else{window.scrollTo(0,0);vf();}}
  else if(d.act==="cnext"){cur.pick=null;cur.i++;cur.ord=shuffle([0,1,2]);if(cur.i>=CAS[cur.c].e.length)casEnd();else{window.scrollTo(0,0);cas();}}
  else if(d.act==="chrono"||d.act==="survie")startRapid(d.act);
  else if(d.act==="vf")startVF();
  else if(d.act==="cas")startCas(+d.arg);
  else if(d.act==="defi")startDefi();
  else if(d.act==="cquiz"){var ct=view.t,cq=cth(ct),cp=shuffle(allIds().filter(function(i){return Q[i][0]===cq;}));cp.sort(function(a,b){return(S.res[a]===1?1:0)-(S.res[b]===1?1:0);});start(shuffle(cp.slice(0,5)),"cours","Cours : "+cname(ct));cur.ct=ct;}
  else if(d.act==="next")next();
  else if(d.act==="memo")startMemo();
  else if(d.act==="flip"){cur.show=true;memo();}
  else if(d.memo!=null){S.memo[cur.ids[cur.i]]=+d.memo;if(+d.memo)cur.ok++;save();cur.i++;cur.show=false;if(cur.i>=cur.ids.length){S.mday=dayStr();save();}memo();}
  else if(d.act==="dnext")duelNext();
  else if(d.act==="daily")start(shuffle(allIds(),rng("ssiap2-"+dayStr())).slice(0,10),"daily","Défi du jour");
  else if(d.act==="exam")start(shuffle(allIds()).slice(0,40),"exam","Examen blanc");
  else if(d.act==="duel")startDuel();
  else if(d.act==="quit"){cur=null;view={name:"home"};render();}
  else if(d.act==="switch"){S.me=null;save();render();}
  else if(d.act==="copy"){var inp=document.getElementById("mycode"),lbl=document.getElementById("copylbl");inp.select();
    var done=function(){lbl.textContent="Code copié";},fail=function(){lbl.textContent="Appuie longtemps sur le code pour le copier";};
    try{navigator.clipboard.writeText(inp.value).then(done,fail);}catch(err){fail();}}
  else if(d.act==="paste"){var raw=document.getElementById("hiscode").value,df=parseDefi(raw);
    if(df){if(df.who===S.me)scores("C'est ton propre défi. Envoie-le à "+P[other()].n+".");else if(S.seeds.indexOf(df.seed)>=0)scores("Tu as déjà joué ce défi.");else startDefi(df.seed,df.score);return;}
    var r=parseCode(raw);
    if(!r)scores("Ce code n'est pas reconnu. Il commence par S3- ou DF- et se copie en entier.");
    else if(r.who===S.me)scores("C'est ton propre code. Il faut celui de "+P[other()].n+".");
    else{S.rival=r;S.rh[r.at]={xp:r.xp,pc:r.pc};save();view={name:"home"};render();}}
});
app.addEventListener("mouseover",function(e){var tp=e.target.closest&&e.target.closest("[data-tip]");if(tp){var te=document.getElementById("tip");if(te)te.textContent=tp.dataset.tip;}});
var navEl=document.getElementById("nav");
if(navEl&&navEl.addEventListener)navEl.addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.dataset.go){cur=null;view={name:b.dataset.go};render();}});
function boot(data){load(data);render();netStart();}
try{if(window.claude&&window.claude.hot){window.claude.hot.snapshot(function(){return S;});}}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
