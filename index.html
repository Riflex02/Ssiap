<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel SSIAP 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Idée : la façade d'un tableau SSI. Fond gris d'armoire, voyants vert / jaune / rouge qui disent l'état de chaque thème, lettrage condensé de signalétique. */
:root{
  --bg:#E6EAE3; --surface:#F7F9F4; --ink:#17201B; --muted:#56615A; --line:#C6CDC3;
  --evac:#0A7A4A; --on-evac:#FFFFFF; --fire:#C4221B; --amber:#C98A00; --off:#AEB6AC; --s1:#2a78d6; --s2:#eb6834;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1A221F; --ink:#E7ECE7; --muted:#96A29A; --line:#2F3A34;
    --evac:#2FBF7F; --on-evac:#07150E; --fire:#FF6257; --amber:#F2B93B; --off:#46524B; --s1:#3987e5; --s2:#d95926;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A221F; --ink:#E7ECE7; --muted:#96A29A; --line:#2F3A34;
  --evac:#2FBF7F; --on-evac:#07150E; --fire:#FF6257; --amber:#F2B93B; --off:#46524B; --s1:#3987e5; --s2:#d95926;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em;line-height:1.05}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.brand b{color:var(--fire)}
.link{background:none;border:0;padding:8px 0;color:var(--muted);text-decoration:underline;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--off);flex:none;border:1px solid rgba(0,0,0,.25)}
.led.g{background:var(--evac);box-shadow:0 0 6px var(--evac)}
.led.a{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.led.r{background:var(--fire);box-shadow:0 0 6px var(--fire)}
.count{display:flex;align-items:flex-end;gap:14px}
.count .big{font-family:var(--display);font-weight:700;font-size:76px;line-height:.85}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.player{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.player.me{border-color:var(--evac);border-width:2px}
.player .name{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase}
.player .xp{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.rows{display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-height:56px}
.btn .t{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;line-height:1.1}
.btn .d{font-size:14px;color:var(--muted)}
.btn.go{background:var(--evac);color:var(--on-evac);border-color:var(--evac)}
.btn.go .d{color:var(--on-evac);opacity:.85}
.btn.fire{border-color:var(--fire)}
.btn:active{transform:translateY(1px)}
.arrow{font-family:var(--display);font-size:24px;flex:none}
.theme{display:flex;align-items:center;gap:12px}
.theme .pc{margin-left:auto;font-family:var(--display);font-weight:700;font-size:20px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--evac)}
.q{font-size:19px;font-weight:600;line-height:1.3;text-wrap:balance}
.opt{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:13px 14px;min-height:52px;font-weight:500}
.opt.ok{background:var(--evac);border-color:var(--evac);color:var(--on-evac)}
.opt.ko{border-color:var(--fire);color:var(--fire)}
.opt[disabled]{cursor:default}
.note{border-left:4px solid var(--amber);padding:8px 12px;background:var(--surface);font-size:15px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.score{font-family:var(--display);font-weight:700;font-size:64px;line-height:.9}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
input.code{width:100%;font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:20px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.pick .name{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tile b{display:block;font-family:var(--display);font-size:32px;line-height:1}
.tile span{font-size:13px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart .nm{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;font-size:14px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
#tip{font-size:14px;min-height:20px}
details summary{cursor:pointer;font-size:14px;color:var(--muted);padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:6px 0}
.row:last-child{border-bottom:0}
.up{color:var(--evac);font-weight:600}.down{color:var(--fire);font-weight:600}
.card{border:2px solid var(--line);border-radius:6px;background:var(--surface);padding:24px 16px;min-height:190px;display:flex;flex-direction:column;gap:14px;justify-content:center;text-align:center}
.card .front{font-family:var(--display);font-weight:700;font-size:28px;text-transform:uppercase;line-height:1.1}
.card .back{font-size:19px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* duel face à face */
.duel{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.half{flex:1;min-height:0;padding:10px 12px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.half.flip{transform:rotate(180deg)}
.half .q{font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .opt{min-height:54px;padding:8px 10px;font-size:14px;line-height:1.2}
.half.lock .opt{opacity:.45}
.mid{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase}
.mid button{background:none;border:1px solid currentColor;border-radius:4px;color:inherit;font-family:var(--body);font-size:13px;padding:4px 8px;text-transform:none}
@media (prefers-reduced-motion: no-preference){
  .led.r{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.35}}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var P={r:{n:"Romain",full:"Romain Degeldere",role:"Recyclage SSIAP 2"},l:{n:"Logan",full:"Logan Aernout",role:"Remise à niveau, examen le 30"}};
var T=[
 {n:"Le feu",f:["Triangle du feu : combustible + comburant (oxygène de l'air, environ 21 %) + énergie d'activation.","Classes de feux : A solides, B liquides et solides liquéfiables, C gaz, D métaux, F huiles et graisses de cuisson.","Propagation : conduction (à travers la matière), convection (air chaud et fumées), rayonnement, projection.","Extinction : refroidissement (eau), étouffement (CO2, mousse), isolement du combustible, inhibition (poudre).","Fumées : chaudes, opaques, mobiles, inflammables, toxiques. Elles tuent avant les flammes.","Flash-over : embrasement généralisé éclair du volume. Backdraft : explosion de fumées par apport d'air brutal."]},
 {n:"Classement ERP et IGH",f:["Catégories : 1re au-dessus de 1 500 ; 2e de 701 à 1 500 ; 3e de 301 à 700 ; 4e 300 et moins ; 5e sous le seuil du type.","1er groupe : catégories 1 à 4 (public + personnel). 2e groupe : 5e catégorie (public seul).","Types : J personnes âgées et handicapées, L spectacles et conférences, M magasins, N restaurants, O hôtels, P danse et jeux, R enseignement, S bibliothèques, T expositions, U soins, V culte, W bureaux et banques, X sport couvert, Y musées.","Types spéciaux : PA plein air, CTS chapiteaux, SG structures gonflables, PS parkings couverts, OA hôtels d'altitude, GA gares, EF flottants, REF refuges.","IGH : plancher bas du dernier niveau à plus de 50 m (habitation) ou plus de 28 m (autres).","Classes IGH : GHA habitation, GHO hôtel, GHR enseignement, GHS archives, GHU sanitaire, GHW bureaux, GHZ mixte. Compartiment : 2 500 m² maximum."]},
 {n:"Évacuation et construction",f:["Unité de passage : 0,60 m. Exceptions : 1 UP = 0,90 m et 2 UP = 1,40 m. Ensuite 3 UP = 1,80 m.","De 101 à 500 personnes : 2 dégagements, et autant d'UP que de centaines (arrondi au-dessus) + 1.","Réaction au feu : M0 incombustible à M4 facilement inflammable. Résistance : stable au feu (R), pare-flammes (E), coupe-feu (EI).","Désenfumage : extraire fumées et chaleur pour garder les cheminements praticables, limiter la propagation, aider les secours. Naturel ou mécanique, par balayage.","Éclairage de sécurité : évacuation (balisage) et ambiance (5 lumens par m²). Autonomie 1 heure.","Voie engins : 3 m de large, 3,50 m de hauteur libre. Voie échelle : 4 m de large, 10 m de long minimum.","EAS : espace d'attente sécurisé pour les personnes qui ne peuvent pas évacuer seules."]},
 {n:"SSI et alarme",f:["5 catégories de SSI : A, B, C, D, E. Le SSI A = SDI (détection) + SMSI (mise en sécurité).","SSI A : équipement d'alarme type 1. SSI B : type 2a.","SDI : détecteurs, déclencheurs manuels, ECS. SMSI : CMSI, DAS, UGA, diffuseurs sonores.","Fonctions de mise en sécurité : compartimentage, désenfumage, évacuation, arrêt de certaines installations techniques.","Zones : ZD détection, ZA alarme, ZC compartimentage, ZF désenfumage, ZS mise en sécurité.","Alarme restreinte : temporisation de 5 minutes maximum. Alarme générale : 5 minutes minimum.","Déclencheurs manuels : à chaque niveau, près des escaliers et des sorties, à 1,30 m environ."]},
 {n:"Moyens de secours",f:["Extincteurs (code du travail) : 6 litres d'eau pulvérisée minimum pour 200 m², au moins un par niveau. Vérification annuelle.","Eau pulvérisée avec additif : A et B. CO2 : B et feux d'origine électrique. Poudre ABC : polyvalente. Jamais d'eau sur une friteuse en feu.","RIA : DN 19/6, 25/8, 33/12. Pression minimale de 2,5 bars au RIA le plus défavorisé.","Colonne sèche : vide, alimentée par les sapeurs-pompiers. Colonne en charge (humide) : IGH de plus de 50 m.","Poteau d'incendie DN 100 : 60 m3/h sous 1 bar.","Sprinkleur : détecte, alerte et attaque le feu. Ampoule rouge : 68 °C."]},
 {n:"Réglementation",f:["ERP : règlement de sécurité du 25 juin 1980 modifié. IGH : arrêté du 30 décembre 2011. SSIAP : arrêté du 2 mai 2005 modifié.","Livres d'articles : GN généralités, CO construction, AM aménagements, DF désenfumage, CH chauffage, GZ gaz, EL électricité, EC éclairage, AS ascenseurs, GC grandes cuisines, MS moyens de secours.","La commission de sécurité donne un avis, favorable ou défavorable. Le maire décide et autorise l'ouverture par arrêté.","CCDSA : présidée par le préfet. Commission d'arrondissement : sous-préfet. Commission communale : maire.","Registre de sécurité : personnel du service incendie, consignes, dates et observations des contrôles et vérifications, travaux.","Recyclage tous les 3 ans (SSIAP 2 : 14 h). Remise à niveau (SSIAP 2 : 21 h) si la date est dépassée ou sans 1 607 h d'activité sur 36 mois.","Service de sécurité (MS 46) : 3 personnes minimum présentes en même temps, dont un chef d'équipe."]},
 {n:"Chef d'équipe",f:["Missions SSIAP 2 : manager l'équipe, former le personnel à la sécurité incendie, prévision technique, entretien élémentaire des moyens, assistance aux personnes, diriger le poste de sécurité lors d'un sinistre, faire respecter l'hygiène et la sécurité du travail côté incendie.","Une consigne : claire, précise, et on vérifie qu'elle est comprise (reformulation). Déléguer une tâche ne retire pas le contrôle du résultat.","En urgence : management directif. Hors urgence : adapter le style à l'agent et à la situation.","Compte rendu : Qui, Quoi, Où, Quand, Comment, Pourquoi. Main courante : tout, dans l'ordre chronologique.","Permis de feu : pour tout travail par point chaud, établi avant les travaux par le chef d'établissement ou son représentant. Surveillance au moins 2 heures après.","Code du travail : exercices d'évacuation au moins tous les 6 mois. Accident du travail déclaré par l'employeur sous 48 h. Droit de retrait en cas de danger grave et imminent."]},
 {n:"Poste de sécurité",f:["Alarme feu : prendre en compte, lire la zone, envoyer un agent en levée de doute avec radio et extincteur.","Feu confirmé : alarme générale sans attendre la fin de la temporisation, puis alerte des secours.","Message d'alerte : adresse précise, nature du sinistre, victimes, risques particuliers, mesures prises. On ne raccroche que quand l'opérateur le dit.","Numéros : 18 pompiers, 15 SAMU, 17 police, 112 numéro européen, 114 par SMS pour sourds et malentendants.","Accueil des secours : un agent au point d'accès avec plans, clés et radio. Le service se met à disposition du commandant des opérations de secours (COS).","Après : réarmement du SSI une fois le sinistre terminé, main courante, compte rendu, remise en état des moyens."]}
];
/* [thème, question, [bonne réponse, 3 fausses], explication] */
var Q=[
[0,"Quels sont les trois éléments du triangle du feu ?",["Combustible, comburant, énergie d'activation","Combustible, carburant, chaleur","Oxygène, azote, flamme","Combustible, fumée, étincelle"],"Sans l'un des trois, pas de combustion."],
[0,"Un feu de classe A concerne :",["Les matériaux solides","Les liquides","Les gaz","Les métaux"],"Classe A : feux de solides, qui forment des braises."],
[0,"Un feu de classe B concerne :",["Les liquides et solides liquéfiables","Les gaz","Les métaux","Les huiles de cuisson"],"Essence, alcool, plastiques qui fondent."],
[0,"Un feu de gaz est un feu de classe :",["C","A","B","D"],"Classe C : gaz. On coupe l'arrivée avant d'éteindre."],
[0,"Un feu de métaux est un feu de classe :",["D","C","F","B"],"Classe D : magnésium, sodium, aluminium en poudre."],
[0,"La classe F correspond aux feux :",["D'huiles et graisses de cuisson","D'origine électrique","De gaz","De solides"],"Classe F : auxiliaires de cuisson."],
[0,"La propagation par les fumées et l'air chaud qui montent s'appelle :",["La convection","La conduction","Le rayonnement","La projection"],"Convection : déplacement des gaz chauds."],
[0,"La chaleur qui traverse une cloison métallique se propage par :",["Conduction","Convection","Rayonnement","Projection"],"Conduction : transmission à travers la matière."],
[0,"L'eau éteint surtout par :",["Refroidissement","Étouffement","Inhibition","Isolement"],"L'eau absorbe la chaleur."],
[0,"Le CO2 éteint surtout par :",["Étouffement","Refroidissement","Isolement","Dilution du combustible"],"Il chasse l'oxygène autour du foyer."],
[0,"Le flash-over, c'est :",["L'embrasement généralisé éclair d'un volume","Une explosion de fumées par apport d'air","Un feu couvant","Une fuite de gaz enflammée"],"Passage brutal du feu localisé à l'embrasement de tout le local."],
[0,"Le backdraft est provoqué par :",["Un apport d'air brutal dans un local sous-ventilé","Un jet d'eau sur de l'huile","Un court-circuit","Une trop forte ventilation mécanique"],"Explosion de fumées, typiquement à l'ouverture d'une porte."],
[0,"Dans un incendie, la première cause de décès est :",["Les fumées","Les brûlures","L'effondrement","La panique"],"Fumées toxiques et opaques."],
[0,"Le comburant le plus courant est :",["L'oxygène de l'air","L'azote","Le gaz carbonique","L'hydrogène"],"L'air contient environ 21 % d'oxygène."],
[1,"Un ERP de 1re catégorie reçoit :",["Plus de 1 500 personnes","De 701 à 1 500 personnes","De 301 à 700 personnes","Plus de 3 000 personnes"],"1re catégorie : au-dessus de 1 500."],
[1,"Un ERP de 2e catégorie reçoit :",["De 701 à 1 500 personnes","De 301 à 700 personnes","De 1 001 à 2 000 personnes","De 501 à 1 000 personnes"],"2e catégorie : 701 à 1 500."],
[1,"Un ERP de 3e catégorie reçoit :",["De 301 à 700 personnes","De 201 à 500 personnes","De 701 à 1 500 personnes","De 101 à 300 personnes"],"3e catégorie : 301 à 700."],
[1,"Un ERP de 4e catégorie reçoit :",["300 personnes et moins, hors 5e catégorie","De 301 à 700 personnes","Moins de 20 personnes","200 personnes et moins"],"4e : 300 et au-dessous, sauf établissements de 5e."],
[1,"Le 1er groupe réunit les catégories :",["1 à 4","1 à 3","1 et 2","1 à 5"],"Le 2e groupe, c'est la 5e catégorie seule."],
[1,"Pour classer un ERP du 1er groupe, on compte :",["Le public et le personnel","Le public seul","Le personnel seul","Les places assises"],"En 5e catégorie, on ne compte que le public."],
[1,"Un centre commercial est un ERP de type :",["M","N","L","T"],"M : magasins de vente, centres commerciaux."],
[1,"Le type L correspond aux :",["Salles de spectacles et de conférences","Restaurants","Hôtels","Bibliothèques"],"L : auditions, conférences, réunions, spectacles."],
[1,"Un restaurant est un ERP de type :",["N","O","M","P"],"N : restaurants et débits de boissons."],
[1,"Un hôtel est un ERP de type :",["O","N","J","U"],"O : hôtels et pensions de famille."],
[1,"Le type J correspond aux :",["Structures pour personnes âgées et handicapées","Salles de jeux","Établissements de soins","Écoles"],"J : accueil de personnes âgées et handicapées."],
[1,"Un hôpital est un ERP de type :",["U","J","R","W"],"U : établissements sanitaires."],
[1,"Une école est un ERP de type :",["R","S","L","X"],"R : enseignement, colonies de vacances."],
[1,"Le type W correspond aux :",["Administrations, banques, bureaux","Musées","Lieux de culte","Salles d'exposition"],"W : administrations, banques, bureaux."],
[1,"Une discothèque est un ERP de type :",["P","L","N","X"],"P : salles de danse et salles de jeux."],
[1,"Le type spécial PS désigne :",["Les parcs de stationnement couverts","Les établissements de plein air","Les piscines","Les patinoires"],"PS : parcs de stationnement couverts. PA : plein air."],
[1,"Le type spécial CTS désigne :",["Les chapiteaux, tentes et structures","Les centres techniques","Les gares","Les refuges"],"CTS : chapiteaux, tentes et structures."],
[1,"Un immeuble d'habitation est un IGH si son dernier plancher bas dépasse :",["50 m","28 m","35 m","100 m"],"Habitation : plus de 50 m. Autres : plus de 28 m."],
[1,"Un immeuble de bureaux est un IGH au-delà de :",["28 m","50 m","18 m","40 m"],"Plus de 28 m pour tout ce qui n'est pas habitation."],
[1,"Un IGH à usage de bureaux est classé :",["GHW","GHA","GHO","GHU"],"GHW : bureaux. GHA habitation, GHO hôtel, GHU sanitaire."],
[1,"La surface maximale d'un compartiment d'IGH est de :",["2 500 m²","1 000 m²","5 000 m²","800 m²"],"Compartiment : 2 500 m² maximum."],
[2,"Une unité de passage vaut :",["0,60 m","0,80 m","0,90 m","1 m"],"Largeur type : 0,60 m."],
[2,"Un dégagement d'une seule UP mesure :",["0,90 m","0,60 m","0,80 m","1,20 m"],"Exception : 1 UP = 0,90 m."],
[2,"Un dégagement de 2 UP mesure :",["1,40 m","1,20 m","1,60 m","1,80 m"],"Exception : 2 UP = 1,40 m."],
[2,"Un dégagement de 3 UP mesure :",["1,80 m","1,40 m","2,10 m","2,40 m"],"À partir de 3 UP : 3 x 0,60 m."],
[2,"Un niveau reçoit 301 personnes. Il faut :",["2 dégagements, 5 UP au total","2 dégagements, 4 UP au total","3 dégagements, 6 UP au total","1 dégagement de 3 UP"],"De 101 à 500 : on arrondit à 400, soit 4 + 1 = 5 UP sur 2 dégagements."],

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function rng(seed){var h=1779033703;for(var i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296;};}
function shuffle(a,r){a=a.slice();r=r||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function chart(){
  var me=P[S.me].n,ot=P[other()].n;

  if(!mine.length&&!his.length)return'<p class="muted">Ta courbe démarre à ta première série de questions.</p>';
  var t1=dnum(dayStr()),t0=Math.min.apply(null,mine.concat(his).map(function(p){return dnum(p.d);}));if(t1-t0<6)t0=t1-6;
  var W=340,H=180,L=42,R=58,Tp=12,B=24;
  var x=function(d){return L+(dnum(d)-t0)/(t1-t0)*(W-L-R);},y=function(v){return Tp+(100-v)/100*(H-Tp-B);};

  [0,50,100].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+' %</text>';});
  var d0=new Date(t0*864e5);

  var ends=[];

    pts.forEach(function(p){s+='<circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="4" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/><circle cx="'+x(p.d).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="14" fill="transparent" data-tip="'+esc(name+" · "+fr(p.d)+" · "+p.v+" % des questions acquises")+'"/>';});
    var l=pts[pts.length-1];ends.push({x:x(l.d)+9,y:y(l.v)+4,n:name});

  ends.forEach(function(e){s+='<text class="nm" x="'+e.x.toFixed(1)+'" y="'+e.y.toFixed(1)+'">'+esc(e.n)+'</text>';});
  s+="</svg>";
  var dates={};mine.forEach(function(p){dates[p.d]=1;});his.forEach(function(p){dates[p.d]=1;});
  var rows=Object.keys(dates).sort().reverse().map(function(d){var m=S.days[d],r=S.rh[d];return"<tr><td>"+fr(d)+"</td><td>"+(m?m.pc+" %":"")+"</td><td>"+(m&&m.a?m.ok+"/"+m.a:"")+"</td><td>"+(r?r.pc+" %":"")+"</td></tr>";}).join("");
  return'<div class="legend"><span><i style="background:var(--s1)"></i>'+esc(me)+'</span><span><i style="background:var(--s2)"></i>'+esc(ot)+' (à chaque code reçu)</span></div><div class="chart">'+s+'</div><p id="tip" class="muted">Touche un point pour voir le détail.</p><details><summary>Voir le tableau</summary><table><thead><tr><th>Jour</th><th>'+esc(me)+'</th><th>Réponses du jour</th><th>'+esc(ot)+'</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
}

}
function duelTap(k,o){
  if(cur.win!==null||cur.lock[k])return;
  if(o===0){cur.win=k;cur.pts[k]++;}
  else{cur.lock[k]=1;if(cur.lock.r&&cur.lock.l)cur.win="";}
  duel();
}
function duelNext(){cur.i++;cur.lock={};cur.win=null;if(cur.i>=cur.ids.length){var a=cur.pts.r,b=cur.pts.l;if(a!==b){S.duel[a>b?"r":"l"]++;}touchStreak();save();view={name:"duelEnd"};render();}else duel();}
function duelEnd(){
  var a=cur.pts.r,b=cur.pts.l,w=a>b?"Romain":b>a?"Logan":null;
  app.innerHTML=head(1)+'<section class="panel"><div class="meta"><span>Duel face à face</span></div><div class="score num">'+a+' – '+b+'</div><h2>'+(w?w+" gagne la manche":"Match nul")+'</h2><p class="muted num">Manches gagnées sur ce téléphone : Romain '+S.duel.r+', Logan '+S.duel.l+'.</p></section><div class="rows"><button class="btn go" data-act="duel"><span class="t">Revanche</span><span class="arrow">→</span></button><button class="btn" data-go="home"><span class="t">Retour au tableau</span><span class="arrow">→</span></button></div>';
}
/* ---------- événements ---------- */
app.addEventListener("click",function(e){
  var tp=e.target.closest("[data-tip]");if(tp){var te=document.getElementById("tip");if(te)te.textContent=tp.dataset.tip;return;}
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.me){S.me=d.me;if(S.rival&&S.rival.who===S.me)S.rival=null;save();view={name:"home"};render();}
  else if(d.go){view={name:d.go};render();}
  else if(d.fiche!=null){view={name:"fiche",t:+d.fiche};render();}
  else if(d.train!=null){var ids;
    if(d.train==="all")ids=shuffle(allIds()).slice(0,10);
    else if(d.train==="err")ids=shuffle(allIds().filter(function(i){return S.res[i]===0;})).slice(0,10);
    else{var t=+d.train,pool=allIds().filter(function(i){return Q[i][0]===t;});
      var todo=shuffle(pool.filter(function(i){return S.res[i]!==1;})),okd=shuffle(pool.filter(function(i){return S.res[i]===1;}));ids=todo.concat(okd).slice(0,10);ids=shuffle(ids);}
    start(ids,"train",d.train==="all"?"Tout mélanger":d.train==="err"?"Mes erreurs":T[+d.train].n);}
  else if(d.opt!=null)answer(+d.opt);
  else if(d.duel)duelTap(d.duel,+d.o);
  else if(d.act==="next")next();
  else if(d.act==="memo")startMemo();
  else if(d.act==="flip"){cur.show=true;memo();}
  else if(d.memo!=null){S.memo[cur.ids[cur.i]]=+d.memo;if(+d.memo)cur.ok++;save();cur.i++;cur.show=false;memo();}
  else if(d.act==="dnext")duelNext();
  else if(d.act==="daily")start(shuffle(allIds(),rng("ssiap2-"+dayStr())).slice(0,10),"daily","Défi du jour");
  else if(d.act==="exam")start(shuffle(allIds()).slice(0,40),"exam","Examen blanc");
  else if(d.act==="duel")startDuel();
  else if(d.act==="quit"){cur=null;view={name:"home"};render();}
  else if(d.act==="switch"){S.me=null;save();render();}
  else if(d.act==="copy"){var inp=document.getElementById("mycode"),lbl=document.getElementById("copylbl");inp.select();
    var done=function(){lbl.textContent="Code copié";},fail=function(){lbl.textContent="Appuie longtemps sur le code pour le copier";};
    try{navigator.clipboard.writeText(inp.value).then(done,fail);}catch(err){fail();}}
  else if(d.act==="paste"){var r=parseCode(document.getElementById("hiscode").value);
    if(!r)scores("Ce code n'est pas reconnu. Il commence par S2- et se copie en entier.");
    else if(r.who===S.me)scores("C'est ton propre code. Il faut celui de "+P[other()].n+".");
    else{S.rival=r;S.rh[r.at]={xp:r.xp,pc:r.pc};save();view={name:"home"};render();}}
});
app.addEventListener("mouseover",function(e){var tp=e.target.closest&&e.target.closest("[data-tip]");if(tp){var te=document.getElementById("tip");if(te)te.textContent=tp.dataset.tip;}});
function boot(data){load(data);render();}
try{if(window.claude&&window.claude.hot){window.claude.hot.snapshot(function(){return S;});}}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
</body>
